name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  animation-service:
    name: Animation Service CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/animation-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/animation-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check cache health
        run: npm run cache-health

      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check api/index.js
